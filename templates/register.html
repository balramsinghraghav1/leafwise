{% extends "base.html" %}
{% block title %}Create an account · Leafwise{% endblock %}
{% block content %}
<section class="wrap auth">
  <div class="card">
    <h1>Create your account</h1>
    <p class="muted">It takes a few seconds. Your scans stay private to you.</p>
    {% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('register') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Your name
        <input type="text" name="name" value="{{ form.name }}" autocomplete="name" maxlength="60" required autofocus>
      </label>
      <label>Email
        <input type="email" name="email" value="{{ form.email }}" autocomplete="email" maxlength="120" required>
      </label>
      <label>Password <small>(at least 8 characters)</small>
        <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      </label>
      <label>Confirm password
        <input type="password" name="confirm" autocomplete="new-password" minlength="8" maxlength="128" required>
      </label>
      <button class="btn full" type="submit">Create account</button>
    </form>
    <p class="alt">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
