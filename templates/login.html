{% extends "base.html" %}
{% block title %}Log in · Leafwise{% endblock %}
{% block content %}
<section class="wrap auth">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to check leaves and see your history.</p>
    {% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Email
        <input type="email" name="email" value="{{ email }}" autocomplete="email" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn full" type="submit">Log in</button>
    </form>
    <p class="alt">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
